name: Track status events

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status-events
  cancel-in-progress: true

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update events.json
        run: node .github/scripts/track-status-events.mjs
        env:
          UPDOWN_API_KEY: ${{ secrets.UPDOWN_API_KEY }}

      - name: Commit changes
        run: |
          if git diff --quiet -- public/events.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/events.json
          git commit -m "chore: track status events"
          git push
